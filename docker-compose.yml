services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:PASSWORD@db:5432/booking_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=PASSWORD
      - POSTGRES_DB=booking_db
    ports:
      - "5432:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data

volumes:
  booking_data: